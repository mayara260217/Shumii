<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notificações | Shumii</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #080127, #281273, #707CCE);
        }

        .header-principal {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 16px 7%;
            background: rgba(8, 1, 39, 0.6);
        }

        .voltar {
            color: white;
            font-size: 22px;
            text-decoration: none;
            line-height: 1;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: white;
            font-size: 22px;
            font-weight: bold;
        }

        .logo-circulo {
            width: 38px;
            height: 38px;
            background: linear-gradient(135deg, #707CCE, #281273);
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }

        main {
            display: flex;
            justify-content: center;
            align-items: center;
            height: calc(100vh - 70px);
        }

        main p {
            color: white;
            font-size: 20px;
            opacity: 0.7;
        }
    </style>
</head>

<body>

    <header class="header-principal">
        <a href="javascript:history.back()" class="voltar">&#8592;</a>
        <a href="../index.html" class="logo">
            <span class="logo-circulo">S</span>
            Shumii
        </a>
    </header>

    <main>
        <p>Sem notificações</p>
    </main>

</body>
</html>
