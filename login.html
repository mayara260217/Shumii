
<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Shumii</title>

    <link rel="stylesheet" href="css/login.css">
</head>

<body>

    <!-- MENU SUPERIOR -->
    <header>
        <nav class="menu">

            <a href="index.html" class="logo">
                <span class="logo-circulo">S</span>
                Shumii
            </a>

            <div class="tipos-acesso">
                <button class="cargo ativo" data-cargo="aluno">Aluno</button>
                <button class="cargo" data-cargo="professor">Professor</button>
                <button class="cargo" data-cargo="responsavel">Responsável</button>
                <button class="cargo" data-cargo="admin">Admin</button>
            </div>

        </nav>
    </header>


    <!-- CARTÃO DE LOGIN -->
    <main class="pagina-login">

        <section class="cartao-login">

            <div class="logo-login">
                <span class="logo-circulo">S</span>
                <h1>Shumii</h1>
            </div>

            <h2 id="titulo-login">Bem-vindo!</h2>

            <p id="descricao-login">Entre na sua conta para continuar.</p>

            <form id="form-login">

                <div id="campos-login">

                    <div class="campo">
                        <label for="email">E-mail</label>
                        <input type="email" id="email"
                            placeholder="Digite seu e-mail" required>
                    </div>

                    <div class="campo">
                        <label for="senha">Senha</label>
                        <input type="password" id="senha"
                            placeholder="Digite sua senha" required>
                    </div>

                </div>

                <a href="#" class="esqueceu-senha" id="recuperar-senha">
                    Esqueceu sua senha?
                </a>

                <button type="submit" class="botao-entrar" onclick="document.querySelectorAll('#campos-login input').forEach(i=>i.removeAttribute('required'))">
                    Entrar
                </button>

            </form>

            <p class="cadastro">
                Não tem uma conta?
                <a href="cadastro.html">Cadastre-se</a>
            </p>

            <a href="index.html" class="voltar">Voltar para o início</a>

        </section>

    </main>


    <script>

        const botoesCargo = document.querySelectorAll(".cargo");
        const camposLogin = document.getElementById("campos-login");
        const tituloLogin = document.getElementById("titulo-login");
        const descricaoLogin = document.getElementById("descricao-login");
        const botaoEntrar = document.querySelector(".botao-entrar");
        const recuperarSenha = document.getElementById("recuperar-senha");
        const cadastro = document.querySelector(".cadastro");
        const formLogin = document.getElementById("form-login");

        function selecionarCargo(cargo) {

            botoesCargo.forEach(botao => {
                botao.classList.remove("ativo");
            });

            document.querySelector(`[data-cargo="${cargo}"]`)
                .classList.add("ativo");

            if (cargo === "aluno") {

                tituloLogin.textContent = "Bem-vindo!";
                descricaoLogin.textContent = "Entre na sua conta para continuar.";

                camposLogin.innerHTML = `
                    <div class="campo">
                        <label for="email">E-mail</label>
                        <input type="email" id="email"
                        placeholder="Digite seu e-mail" required>
                    </div>

                    <div class="campo">
                        <label for="senha">Senha</label>
                        <input type="password" id="senha"
                        placeholder="Digite sua senha" required>
                    </div>
                `;

                recuperarSenha.style.display = "block";
                cadastro.style.display = "block";

            }

            else if (cargo === "professor") {

                tituloLogin.textContent = "Área do Professor";
                descricaoLogin.textContent = "Acesse sua conta de professor.";

                camposLogin.innerHTML = `
                    <div class="campo">
                        <label for="email">E-mail</label>
                        <input type="email" id="email"
                        placeholder="Digite seu e-mail" required>
                    </div>

                    <div class="campo">
                        <label for="codigo">Código da turma</label>
                        <input type="text" id="codigo"
                        placeholder="Digite o código da turma" required>
                    </div>

                    <div class="campo">
                        <label for="senha">Senha</label>
                        <input type="password" id="senha"
                        placeholder="Digite sua senha" required>
                    </div>
                `;

                recuperarSenha.style.display = "none";
                cadastro.style.display = "none";

            }

            else if (cargo === "responsavel") {

                tituloLogin.textContent = "Área do Responsável";
                descricaoLogin.textContent = "Identifique o aluno vinculado à sua conta.";

                camposLogin.innerHTML = `
                    <div class="campo">
                        <label for="nome-aluno">Nome do aluno</label>
                        <input type="text" id="nome-aluno"
                        placeholder="Nome completo do aluno" required>
                    </div>

                    <div class="campo">
                        <label for="nascimento">Data de nascimento</label>
                        <input type="date" id="nascimento" required>
                    </div>
                `;

                recuperarSenha.style.display = "none";
                cadastro.style.display = "none";

            }

            else if (cargo === "admin") {

                tituloLogin.textContent = "Área Administrativa";
                descricaoLogin.textContent = "Acesso restrito ao administrador.";

                camposLogin.innerHTML = `
                    <div class="campo">
                        <label for="codigo-admin">Código de administrador</label>
                        <input type="password" id="codigo-admin"
                        placeholder="Digite o código de acesso" required>
                    </div>
                `;

                recuperarSenha.style.display = "none";
                cadastro.style.display = "none";

            }

        }

        botoesCargo.forEach(botao => {
            botao.addEventListener("click", () => {
                selecionarCargo(botao.dataset.cargo);
            });
        });

        formLogin.addEventListener("submit", function(event) {
            event.preventDefault();
            const cargo = document.querySelector(".cargo.ativo").dataset.cargo;
            if (cargo === "aluno") {
                window.location.href = "aluno/dashboard.html";
            } else if (cargo === "professor") {
                window.location.href = "professor/dashboard-professor.html";
            } else if (cargo === "responsavel") {
                window.location.href = "responsavel/dashboard-responsavel.html";
            } else {
                alert("Tela demonstrativa: a autenticação será configurada posteriormente.");
            }
        });

    </script>

</body>
</html>
