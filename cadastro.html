
<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro | Shumii</title>

    <link rel="stylesheet" href="css/cadastro.css">
</head>

<body>

    <header>
        <nav class="menu">

            <a href="index.html" class="logo">
                <span class="logo-circulo">S</span>
                Shumii
            </a>

            <div class="tipos-acesso">
                <button class="cargo ativo" data-cargo="aluno">Aluno</button>
                <button class="cargo" data-cargo="professor">Professor</button>
                <button class="cargo" data-cargo="responsavel">Responsável</button>
                <button class="cargo" data-cargo="admin">Admin</button>
            </div>

        </nav>
    </header>

    <main class="pagina-cadastro">

        <section class="cartao-cadastro">

            <div class="logo-cadastro">
                <span class="logo-circulo">S</span>
                <h1>Shumii</h1>
            </div>

            <h2 id="titulo-cadastro">Crie sua conta!</h2>

            <p id="descricao-cadastro">
                Preencha seus dados para começar.
            </p>

            <form id="form-cadastro">

                <div id="campos-cadastro">

                    <div class="campo">
                        <label for="nome">Nome completo</label>
                        <input type="text" id="nome"
                            placeholder="Digite seu nome" required>
                    </div>

                    <div class="campo">
                        <label for="nascimento">Data de nascimento</label>
                        <input type="date" id="nascimento" required>
                    </div>

                    <div class="campo">
                        <label for="email">E-mail</label>
                        <input type="email" id="email"
                            placeholder="Digite seu e-mail" required>
                    </div>

                    <div class="campo">
                        <label for="senha">Senha</label>
                        <input type="password" id="senha"
                            placeholder="Crie uma senha" required>
                    </div>

                    <div class="campo">
                        <label for="confirmar-senha">Confirmar senha</label>
                        <input type="password" id="confirmar-senha"
                            placeholder="Digite novamente sua senha" required>
                    </div>

                </div>

                <button type="submit" class="botao-cadastrar">
                    Criar conta
                </button>

            </form>

            <p class="login">
                Já possui uma conta?
                <a href="login.html">Fazer login</a>
            </p>

            <a href="index.html" class="voltar">
                Voltar para o início
            </a>

        </section>

    </main>

    <script>

        const botoesCargo = document.querySelectorAll(".cargo");
        const camposCadastro = document.getElementById("campos-cadastro");
        const tituloCadastro = document.getElementById("titulo-cadastro");
        const descricaoCadastro = document.getElementById("descricao-cadastro");
        const formCadastro = document.getElementById("form-cadastro");

        function selecionarCargo(cargo) {

            botoesCargo.forEach(botao => {
                botao.classList.remove("ativo");
            });

            document.querySelector(`[data-cargo="${cargo}"]`)
                .classList.add("ativo");

            if (cargo === "aluno") {

                tituloCadastro.textContent = "Crie sua conta!";
                descricaoCadastro.textContent =
                    "Preencha seus dados para começar.";

                camposCadastro.innerHTML = `
                    <div class="campo">
                        <label>Nome completo</label>
                        <input type="text" placeholder="Digite seu nome" required>
                    </div>

                    <div class="campo">
                        <label>Data de nascimento</label>
                        <input type="date" required>
                    </div>

                    <div class="campo">
                        <label>E-mail</label>
                        <input type="email" placeholder="Digite seu e-mail" required>
                    </div>

                    <div class="campo">
                        <label>Senha</label>
                        <input type="password" placeholder="Crie uma senha" required>
                    </div>

                    <div class="campo">
                        <label>Confirmar senha</label>
                        <input type="password" placeholder="Confirme sua senha" required>
                    </div>
                `;

            }

            else if (cargo === "professor") {

                tituloCadastro.textContent = "Cadastro de Professor";
                descricaoCadastro.textContent =
                    "Preencha seus dados para solicitar seu acesso.";

                camposCadastro.innerHTML = `
                    <div class="campo">
                        <label>Nome completo</label>
                        <input type="text" placeholder="Digite seu nome" required>
                    </div>

                    <div class="campo">
                        <label>E-mail</label>
                        <input type="email" placeholder="Digite seu e-mail" required>
                    </div>

                    <div class="campo">
                        <label>Código da turma</label>
                        <input type="text" placeholder="Digite o código da turma" required>
                    </div>

                    <div class="campo">
                        <label>Senha</label>
                        <input type="password" placeholder="Crie uma senha" required>
                    </div>
                `;

            }

            else if (cargo === "responsavel") {

                tituloCadastro.textContent = "Cadastro de Responsável";
                descricaoCadastro.textContent =
                    "Informe os dados para vincular o aluno.";

                camposCadastro.innerHTML = `
                    <div class="campo">
                        <label>Nome do responsável</label>
                        <input type="text" placeholder="Seu nome completo" required>
                    </div>

                    <div class="campo">
                        <label>E-mail</label>
                        <input type="email" placeholder="Seu e-mail" required>
                    </div>

                    <div class="campo">
                        <label>Nome do aluno</label>
                        <input type="text" placeholder="Nome completo do aluno" required>
                    </div>

                    <div class="campo">
                        <label>Data de nascimento do aluno</label>
                        <input type="date" required>
                    </div>
                `;

            }

            else if (cargo === "admin") {

                tituloCadastro.textContent = "Acesso Administrativo";
                descricaoCadastro.textContent =
                    "Área exclusiva para administradores.";

                camposCadastro.innerHTML = `
                    <div class="campo">
                        <label>Código de administrador</label>
                        <input type="password" placeholder="Digite o código de acesso" required>
                    </div>
                `;

            }

        }

        botoesCargo.forEach(botao => {
            botao.addEventListener("click", () => {
                selecionarCargo(botao.dataset.cargo);
            });
        });

        formCadastro.addEventListener("submit", function(event) {
            event.preventDefault();

            alert("Cadastro demonstrativo. A validação será configurada posteriormente.");
        });

    </script>

</body>
</html>
