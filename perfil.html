<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil | Shumii</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #080127, #281273, #707CCE);
        }

        .header-principal {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 16px 7%;
            background: rgba(8, 1, 39, 0.6);
        }

        .voltar {
            color: white;
            font-size: 22px;
            text-decoration: none;
            line-height: 1;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: white;
            font-size: 22px;
            font-weight: bold;
        }

        .logo-circulo {
            width: 38px;
            height: 38px;
            background: linear-gradient(135deg, #707CCE, #281273);
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }

        main {
            display: flex;
            justify-content: center;
            padding: 40px 20px;
        }

        .cartao {
            background: white;
            width: 100%;
            max-width: 390px;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.25);
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .campo-info label {
            display: block;
            color: #281273;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 6px;
        }

        .campo-info p {
            color: #444;
            font-size: 15px;
            padding: 12px;
            background: #f4f4f4;
            border-radius: 8px;
        }

        .btn-acao {
            width: 100%;
            padding: 14px;
            background: linear-gradient(90deg, #281273, #707CCE);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-acao:hover {
            opacity: 0.85;
        }
    </style>
</head>

<body>

    <header class="header-principal">
        <a href="javascript:history.back()" class="voltar">&#8592;</a>
        <a href="../index.html" class="logo">
            <span class="logo-circulo">S</span>
            Shumii
        </a>
    </header>

    <main>
        <div class="cartao">

            <div class="campo-info">
                <label>Email</label>
                <p>usuario@shumii.com</p>
            </div>

            <div class="campo-info">
                <label>Senha</label>
                <p>••••••••••</p>
            </div>

            <button class="btn-acao">Mudar Email</button>
            <button class="btn-acao">Mudar Senha</button>

        </div>
    </main>

</body>
</html>
