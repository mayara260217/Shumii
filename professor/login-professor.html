<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Professor | Shumii</title>
    <link rel="stylesheet" href="../CSS/login.css">
</head>

<body>

    <header>
        <nav class="menu">
            <a href="../index.html" class="logo">
                <span class="logo-circulo">S</span>
                Shumii
            </a>
        </nav>
    </header>

    <main class="pagina-login">

        <section class="cartao-login">

            <div class="logo-login">
                <span class="logo-circulo">S</span>
                <h1>Shumii</h1>
            </div>

            <h2>Área do Professor</h2>
            <p>Acesse sua conta de professor.</p>

            <form id="form-login">

                <div class="campo">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" placeholder="Digite seu e-mail">
                </div>

                <div class="campo">
                    <label for="codigo">Código da turma</label>
                    <input type="text" id="codigo" placeholder="Digite o código da turma">
                </div>

                <div class="campo">
                    <label for="senha">Senha</label>
                    <input type="password" id="senha" placeholder="Digite sua senha">
                </div>

                <button type="submit" class="botao-entrar">Entrar</button>

            </form>

            <a href="../login.html" class="voltar">Voltar para o início</a>

        </section>

    </main>

    <script>
        document.getElementById("form-login").addEventListener("submit", function(e) {
            e.preventDefault();
            window.location.href = "dashboard-professor.html";
        });
    </script>

</body>
</html>
